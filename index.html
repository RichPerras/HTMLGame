<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Plateforme - Mode Compétition</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }
        canvas {
            border: 4px solid #ffffff;
            background-color: #222222;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 96vw;
            height: auto;
        }
        .instructions {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaaaaa;
        }
        #editorNamePanel {
            margin-top: 8px;
            color: #ffffff;
            font-size: 0.9rem;
        }
        #editorNamePanel input {
            margin-left: 6px;
            padding: 5px;
            background: #222222;
            border: 1px solid #aaaaaa;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Jeu de Plateforme & Emojis - Compétition</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="editorNamePanel" hidden>Nom du tableau : <input id="editorLevelName" type="text" maxlength="40"></div>
    <div class="instructions"><b>Clavier :</b> flèches, <b>Espace</b> pour tirer. <b>Manette PSOne Mini :</b> stick/croix directionnelle, <b>Croix</b> pour sauter, <b>Carré</b> ou gâchette droite pour tirer, <b>Start</b> pour valider.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const editorNamePanel = document.getElementById("editorNamePanel");
        const editorNameInput = document.getElementById("editorLevelName");

        function resizeGameCanvas() {
            const availableHeight = Math.max(120, window.innerHeight - 110);
            const targetWidth = Math.sqrt(window.innerWidth * window.innerHeight);
            const canvasWidth = Math.min(targetWidth, window.innerWidth * 0.96, availableHeight * 2);
            canvas.style.width = `${canvasWidth}px`;
        }

        window.addEventListener("resize", resizeGameCanvas);
        resizeGameCanvas();

        const SHEETDB_URL = "https://sheetdb.io/api/v1/exp6qwvzmrmzk";

        let gameState = "MENU";
        let deathTimer = 0;
        let levelClearTimer = 0;
        let spawnProtectionTimer = 0;
        let gamepadInput = { left: false, right: false, up: false, down: false };
        let previousGamepadButtons = [];

        let player = {
            x: 50, y: 300, width: 30, height: 30,
            vx: 0, vy: 0, speed: 5, jumpPower: -11,
            grounded: false, facing: 1,
            ignorePlatform: null // Référence temporaire à la plateforme ignorée lors de l'appui sur Bas
        };

        let enemies = [];
        let targets = [];
        let bullets = [];
        let particles = [];
        let spikes = [];
        let topScores = [];

        const gravity = 0.5;
        let keys = {};
        let score = 0;
        let level = 0;
        let lives = 4;
        let nextLifeMilestone = 250;
        let platforms = [];
        const CUSTOM_LEVELS_STORAGE_KEY = "htmlgame-custom-levels";
        let customLevels = loadCustomLevels();
        let customEditor = { level: null, tool: "platform", dragStart: null, pointer: null, message: "", dirty: false };
        let customListOffset = 0;
        let customMode = false;
        let customReturnState = "CUSTOM_LEVELS";

        let screenFlashColor = null;
        let flashTimer = 0;

        function triggerFlash(color, duration = 15) {
            screenFlashColor = color;
            flashTimer = duration;
        }

        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 4;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    decay: 0.02 + Math.random() * 0.03
                });
            }
        }

        function createFirework(x, y) {
            const colors = ["#FFEB3B", "#FF4081", "#00BCD4", "#4CAF50", "#FF9800", "#E040FB"];
            for (let i = 0; i < 60; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2 + Math.random() * 6;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: 0.01 + Math.random() * 0.015
                });
            }
        }

        let scoreSubmitted = false;

        function checkCollisionRect(r1, r2, margin = 5) {
            return (
                r1.x < r2.x + r2.width + margin &&
                r1.x + r1.width + margin > r2.x &&
                r1.y < r2.y + r2.height + margin &&
                r1.y + r1.height + margin > r2.y
            );
        }

        async function fetchLeaderboard() {
            try {
                let response = await fetch(SHEETDB_URL);
                let data = await response.json();
                if (Array.isArray(data)) {
                    data.sort((a, b) => parseInt(b.score) - parseInt(a.score));
                    topScores = data.slice(0, 5);
                }
            } catch (error) {
                console.error("Erreur de chargement du classement :", error);
            }
        }

        async function submitScore(playerName, finalScore) {
            try {
                let response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        data: {
                            nom: playerName,
                            score: finalScore
                        }
                    })
                });
                let result = await response.json();
                fetchLeaderboard();
            } catch (error) {
                console.error("Erreur d'envoi du score :", error);
            }
        }

        fetchLeaderboard();

        // --- BASE DE DONNÉES DE 50 NIVEAUX FIXES ET SÉCURISÉS ---
        const PRESET_LEVELS = [];

        function generatePresetDatabase() {
            for (let l = 0; l < 50; l++) {
                let lvlData = { platforms: [], spikes: [], targets: [], enemies: [] };

                if (l === 0) {
                    lvlData.platforms.push({ x: 0, y: 360, width: 200, height: 40, type: "normal", visible: true, isGround: true });
                    lvlData.platforms.push({ x: 260, y: 280, width: 120, height: 18, type: "normal", visible: true, isGround: false });
                    lvlData.platforms.push({ x: 440, y: 200, width: 120, height: 18, type: "normal", visible: true, isGround: false });
                    lvlData.platforms.push({ x: 620, y: 120, width: 120, height: 18, type: "normal", visible: true, isGround: false });

                    lvlData.targets.push({ x: 320, y: 280 - 18, radius: 14, collected: false });
                    lvlData.targets.push({ x: 500, y: 200 - 18, radius: 14, collected: false });
                    lvlData.targets.push({ x: 680, y: 120 - 18, radius: 14, collected: false });
                    lvlData.targets.push({ x: 100, y: 360 - 18, radius: 14, collected: false });
                    lvlData.targets.push({ x: 350, y: 360 - 18, radius: 14, collected: false });

                    lvlData.enemies.push({
                        x: 460, y: 200 - 28, width: 28, height: 28,
                        vx: 1, minX: 440, maxX: 440 + 120 - 28, alive: true
                    });

                    PRESET_LEVELS.push(lvlData);
                    continue;
                }

                lvlData.platforms.push({ x: 0, y: 360, width: 180, height: 40, type: "normal", visible: true, isGround: true });

                let numPlats = 4 + Math.floor(l / 15);
                let lastX = 180, lastY = 360;

                for (let i = 0; i < numPlats; i++) {
                    let pWidth = Math.max(75, 100 - (l * 0.3));
                    let pY = lastY - (35 + (i % 2) * 25);
                    if (pY < 90) pY = 90 + (i % 2) * 30;
                    if (pY > 300) pY = 300;

                    let pX = lastX + 45 + Math.random() * 60;
                    if (pX + pWidth > 760) pX = 760 - pWidth;

                    let type = "normal";
                    if (l >= 8 && i % 2 === 1) {
                        type = (l >= 25 && i % 3 === 0) ? "vanish" : "moving";
                    }

                    let newPlat = {
                        x: pX, y: pY, width: pWidth, height: 18,
                        type: type, visible: true, isGround: false,
                        vx: (type === "moving") ? 1.2 : 0,
                        minX: Math.max(40, pX - 45),
                        maxX: Math.min(760, pX + 45),
                        timer: 0
                    };
                    lvlData.platforms.push(newPlat);
                    lastX = pX; lastY = pY;

                    if (l >= 4 && type === "normal" && pWidth > 85 && i > 0 && (l + i) % 4 === 0) {
                        lvlData.spikes.push({
                            x: pX + pWidth / 2 - 10,
                            y: pY - 12,
                            width: 20,
                            height: 12
                        });
                    }
                }

                let platList = [...lvlData.platforms];
                for (let i = 0; i < 5; i++) {
                    let p = platList[i % platList.length];
                    let tx = p.x + p.width / 2;
                    let ty = p.y - 18;
                    let hasSpike = lvlData.spikes.some(s => Math.abs(s.x + 10 - tx) < 20);
                    if (hasSpike) tx -= 20;
                    
                    lvlData.targets.push({ x: tx, y: ty, radius: 14, collected: false });
                }

                if (l >= 2) {
                    let enemyPlats = lvlData.platforms.filter(p => p.x > 200);
                    for (let p of enemyPlats) {
                        if (lvlData.enemies.length >= Math.min(4, 2 + Math.floor(l / 12))) break;
                        let hasSpike = lvlData.spikes.some(s =>
                            Math.abs(s.y + s.height - p.y) < 1 &&
                            s.x < p.x + p.width &&
                            s.x + s.width > p.x
                        );
                        if (!hasSpike) {
                            lvlData.enemies.push({
                                x: p.x + 10, y: p.y - 28, width: 28, height: 28,
                                vx: 1.5, minX: p.x, maxX: p.x + p.width - 28, alive: true
                            });
                        }
                    }
                }

                PRESET_LEVELS.push(lvlData);
            }
        }

        generatePresetDatabase();

        function createEmptyCustomLevel(name = "Nouveau tableau") {
            return {
                id: Date.now(),
                name,
                platforms: [{ x: 0, y: 360, width: 800, height: 40, type: "normal", visible: true, isGround: true }],
                spikes: [],
                targets: [{ x: 740, y: 330, radius: 14, collected: false }],
                enemies: []
            };
        }

        function loadCustomLevels() {
            try {
                const saved = JSON.parse(localStorage.getItem(CUSTOM_LEVELS_STORAGE_KEY) || "[]");
                if (!Array.isArray(saved)) throw new Error("Le format des tableaux sauvegardés est invalide.");
                return saved.filter(item =>
                    item && Number.isFinite(item.id) && typeof item.name === "string" &&
                    Array.isArray(item.platforms) && Array.isArray(item.spikes) &&
                    Array.isArray(item.targets) && Array.isArray(item.enemies)
                );
            } catch (error) {
                console.error("Erreur de chargement des tableaux personnalisés :", error);
                return [];
            }
        }

        function saveCustomLevels() {
            try {
                localStorage.setItem(CUSTOM_LEVELS_STORAGE_KEY, JSON.stringify(customLevels));
                return true;
            } catch (error) {
                console.error("Erreur de sauvegarde des tableaux personnalisés :", error);
                customEditor.message = "Sauvegarde impossible dans ce navigateur.";
                return false;
            }
        }

        function copyLevelData(data) {
            return JSON.parse(JSON.stringify(data));
        }

        function applyLevelData(data) {
            platforms = copyLevelData(data.platforms);
            spikes = copyLevelData(data.spikes);
            targets = copyLevelData(data.targets);
            enemies = copyLevelData(data.enemies);
            bullets = [];
            particles = [];

            player.x = 50; player.y = 300; player.vx = 0; player.vy = 0; player.grounded = false;
            player.ignorePlatform = null;
            spawnProtectionTimer = 60;
        }

        function loadLevel(levelIndex) {
            let index = levelIndex % PRESET_LEVELS.length;
            let data = PRESET_LEVELS[index];

            applyLevelData(data);
            customMode = false;
        }

        function startCustomLevel(data, returnState) {
            score = 0; lives = 4; nextLifeMilestone = 250;
            customMode = true;
            customReturnState = returnState;
            applyLevelData(data);
            gameState = "PLAYING";
        }

        function returnFromCustomLevel() {
            customMode = false;
            gameState = customReturnState;
            if (gameState === "EDITOR" && !customEditor.level) {
                gameState = "CUSTOM_LEVELS";
            }
        }

        function triggerDeath() {
            if (spawnProtectionTimer > 0) return;
            if (gameState === "DYING" || gameState === "GAMEOVER" || gameState === "LEVEL_CLEARING" || gameState === "LEVEL_WAITING") return;
            
            gameState = "DYING";
            deathTimer = 50;
            createExplosion(player.x + player.width / 2, player.y + player.height / 2, "#F44336", 30);
            triggerFlash("rgba(255, 0, 0, 0.5)", 25);
            lives--;
        }

        function triggerLevelClear() {
            if (customMode) {
                gameState = "CUSTOM_COMPLETE";
                createFirework(canvas.width / 2, canvas.height / 2);
                return;
            }
            gameState = "LEVEL_CLEARING";
            levelClearTimer = 80;
            createFirework(canvas.width / 2, canvas.height / 2);
            createFirework(canvas.width / 3, canvas.height / 3);
            createFirework((canvas.width / 3) * 2, canvas.height / 3);
            triggerFlash("rgba(255, 255, 255, 0.4)", 20);
        }

        function startGame() {
            score = 0; level = 0; lives = 4; nextLifeMilestone = 250;
            scoreSubmitted = false;
            particles = [];
            fetchLeaderboard();
            loadLevel(level);
            gameState = "PLAYING";
        }

        function handleConfirmAction() {
            if (gameState === "MENU") {
                startGame();
            } else if (gameState === "CUSTOM_COMPLETE") {
                returnFromCustomLevel();
            } else if (gameState === "LEVEL_WAITING") {
                level++;
                loadLevel(level);
                gameState = "PLAYING";
            } else if (gameState === "GAMEOVER") {
                gameState = customMode ? customReturnState : "MENU";
                customMode = false;
                fetchLeaderboard();
            } else if (gameState === "VICTORY") {
                if (!scoreSubmitted) {
                    let playerName = prompt("Victoire ! Entrez votre nom pour le classement mondial :", "Joueur");
                    if (!playerName || !playerName.trim()) return;

                    scoreSubmitted = true;
                    submitScore(playerName.trim(), score);
                }
                gameState = "MENU";
                fetchLeaderboard();
            }
        }

        function canvasPoint(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / (rect.width - 8);
            const scaleY = canvas.height / (rect.height - 8);
            return {
                x: (event.clientX - rect.left - 4) * scaleX,
                y: (event.clientY - rect.top - 4) * scaleY
            };
        }

        function saveEditorLevel() {
            const name = editorNameInput.value.trim();
            if (!name) {
                customEditor.message = "Entrez un nom pour sauvegarder.";
                editorNameInput.focus();
                return false;
            }
            customEditor.level.name = name;

            const existingIndex = customLevels.findIndex(item => item.id === customEditor.level.id);
            if (existingIndex >= 0) customLevels[existingIndex] = copyLevelData(customEditor.level);
            else customLevels.push(copyLevelData(customEditor.level));

            if (!saveCustomLevels()) return false;
            customEditor.message = "Tableau sauvegardé.";
            customEditor.dirty = false;
            return true;
        }

        function leaveEditor() {
            if (customEditor.dirty) {
                customEditor.message = "Sauvegardez ou testez le tableau avant de quitter.";
                return;
            }
            customEditor.dragStart = null;
            customEditor.pointer = null;
            gameState = "CUSTOM_LEVELS";
        }

        function removeEditorItem(x, y) {
            const levelData = customEditor.level;
            const targetIndex = levelData.targets.findIndex(item => Math.hypot(item.x - x, item.y - y) < 22);
            if (targetIndex >= 0) { levelData.targets.splice(targetIndex, 1); return; }

            const enemyIndex = levelData.enemies.findIndex(item => Math.hypot(item.x + 14 - x, item.y + 14 - y) < 24);
            if (enemyIndex >= 0) { levelData.enemies.splice(enemyIndex, 1); return; }

            const spikeIndex = levelData.spikes.findIndex(item =>
                x >= item.x - 10 && x <= item.x + item.width + 10 &&
                y >= item.y - 10 && y <= item.y + item.height + 10
            );
            if (spikeIndex >= 0) { levelData.spikes.splice(spikeIndex, 1); return; }

            const platformIndex = levelData.platforms.findIndex(item =>
                x >= item.x && x <= item.x + item.width && y >= item.y - 8 && y <= item.y + item.height + 8
            );
            if (platformIndex >= 0) levelData.platforms.splice(platformIndex, 1);
        }

        canvas.addEventListener("mousedown", event => {
            const { x, y } = canvasPoint(event);

            if (gameState === "MENU") {
                if (y >= 300 && y < 350) startGame();
                else if (y >= 350) {
                    customListOffset = 0;
                    gameState = "CUSTOM_LEVELS";
                }
                return;
            }

            if (gameState === "CUSTOM_LEVELS") {
                if (y >= 340 && y < 390) {
                    customEditor.level = createEmptyCustomLevel(`Tableau ${customLevels.length + 1}`);
                    editorNameInput.value = customEditor.level.name;
                    customEditor.tool = "platform";
                    customEditor.message = "Clique-glisse pour placer une plateforme.";
                    customEditor.dirty = true;
                    gameState = "EDITOR";
                    return;
                }
                if (y >= 90 && y < 325) {
                    const visibleIndex = Math.floor((y - 95) / 45);
                    const levelIndex = customListOffset + visibleIndex;
                    const item = customLevels[levelIndex];
                    if (!item) return;
                    if (x >= 590 && x < 685) {
                        customLevels.splice(levelIndex, 1);
                        customListOffset = Math.min(customListOffset, Math.max(0, customLevels.length - 5));
                        saveCustomLevels();
                    } else if (x >= 470 && x < 590) {
                        customEditor.level = copyLevelData(item);
                        editorNameInput.value = customEditor.level.name;
                        customEditor.tool = "platform";
                        customEditor.message = "Tableau chargé dans l’éditeur.";
                        customEditor.dirty = false;
                        gameState = "EDITOR";
                    } else {
                        startCustomLevel(item, "CUSTOM_LEVELS");
                    }
                } else if (y >= 390) {
                    gameState = "MENU";
                }
                return;
            }

            if (gameState !== "EDITOR") return;

            if (y < 55) {
                if (x < 105) customEditor.tool = "platform";
                else if (x < 195) customEditor.tool = "enemy";
                else if (x < 285) customEditor.tool = "target";
                else if (x < 375) customEditor.tool = "spike";
                else if (x < 465) customEditor.tool = "erase";
                else if (x >= 641) leaveEditor();
                else if (x >= 558) {
                    if (customEditor.level.targets.length === 0) {
                        customEditor.message = "Ajoutez au moins une cerise avant de tester.";
                        return;
                    }
                    if (saveEditorLevel()) startCustomLevel(customEditor.level, "EDITOR");
                } else if (x >= 475) saveEditorLevel();
                return;
            }

            if (customEditor.tool === "platform") {
                customEditor.dragStart = { x, y };
            } else if (customEditor.tool === "target") {
                customEditor.level.targets.push({ x, y, radius: 14, collected: false });
                customEditor.dirty = true;
            } else if (customEditor.tool === "enemy") {
                customEditor.level.enemies.push({
                    x: Math.max(0, Math.min(canvas.width - 28, x - 14)),
                    y: Math.max(65, Math.min(canvas.height - 28, y - 14)),
                    width: 28, height: 28, vx: 1.5,
                    minX: Math.max(0, x - 50), maxX: Math.min(canvas.width - 28, x + 50),
                    alive: true
                });
                customEditor.dirty = true;
            } else if (customEditor.tool === "spike") {
                customEditor.level.spikes.push({ x: x - 10, y: y - 12, width: 20, height: 12 });
                customEditor.dirty = true;
            } else if (customEditor.tool === "erase") {
                removeEditorItem(x, y);
                customEditor.dirty = true;
            }
        });

        canvas.addEventListener("mouseup", event => {
            if (gameState !== "EDITOR" || !customEditor.dragStart) return;
            const end = canvasPoint(event);
            const start = customEditor.dragStart;
            const x = Math.max(0, Math.min(start.x, end.x));
            const width = Math.max(40, Math.min(canvas.width - x, Math.abs(end.x - start.x)));
            const y = Math.max(70, Math.min(canvas.height - 18, start.y));
            customEditor.level.platforms.push({
                x, y, width, height: 18, type: "normal", visible: true,
                isGround: y >= canvas.height - 40
            });
            customEditor.dirty = true;
            customEditor.dragStart = null;
        });

        canvas.addEventListener("mousemove", event => {
            if (gameState === "EDITOR" && customEditor.dragStart) {
                customEditor.pointer = canvasPoint(event);
            }
        });

        canvas.addEventListener("mouseleave", () => {
            if (gameState === "EDITOR") {
                customEditor.dragStart = null;
                customEditor.pointer = null;
            }
        });

        canvas.addEventListener("wheel", event => {
            if (gameState !== "CUSTOM_LEVELS") return;
            event.preventDefault();
            const maxOffset = Math.max(0, customLevels.length - 5);
            customListOffset = Math.max(0, Math.min(maxOffset, customListOffset + Math.sign(event.deltaY)));
        }, { passive: false });

        window.addEventListener("keydown", event => {
            if (gameState === "EDITOR" && event.code === "Escape") leaveEditor();
            else if (gameState === "CUSTOM_LEVELS" && event.code === "Escape") gameState = "MENU";
        });

        window.addEventListener("keydown", (e) => {
            if ((gameState === "MENU" && e.code === "Space") ||
                (["LEVEL_WAITING", "GAMEOVER", "VICTORY"].includes(gameState) && (e.code === "Space" || e.code === "Enter"))) {
                handleConfirmAction();
                return;
            }

            if (gameState === "PLAYING" && e.code === "Space") {
                bullets.push({ x: player.x + player.width / 2, y: player.y + player.height / 2, radius: 5, vx: player.facing * 8 });
            }

            keys[e.code] = true;
        });

        window.addEventListener("keyup", (e) => { 
            keys[e.code] = false; 
            if (e.code === "ArrowDown") {
                player.ignorePlatform = null; // Réinitialise l'autorisation de traverser quand on relâche la touche Bas
            }
        });

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gamepad = Array.from(gamepads).find(pad => pad && pad.connected);
            if (!gamepad) {
                gamepadInput = { left: false, right: false, up: false, down: false };
                previousGamepadButtons = [];
                return;
            }

            const jumpButtonIndex = 3;
            const shootButtonIndex = 2;
            const buttonPressed = index => {
                const button = gamepad.buttons[index];
                return Boolean(button && (button.pressed || button.value > 0.5));
            };
            const justPressed = index => buttonPressed(index) && !previousGamepadButtons[index];
            const axisX = gamepad.axes[0] || 0;
            const axisY = gamepad.axes[1] || 0;

            gamepadInput.left = axisX < -0.25 || buttonPressed(14);
            gamepadInput.right = axisX > 0.25 || buttonPressed(15);
            gamepadInput.up = axisY < -0.25 || buttonPressed(12);
            gamepadInput.down = axisY > 0.25 || buttonPressed(13);

            if (justPressed(jumpButtonIndex) || justPressed(9)) handleConfirmAction();
            if (gameState === "PLAYING" && (justPressed(shootButtonIndex) || justPressed(5) || justPressed(7))) {
                bullets.push({ x: player.x + player.width / 2, y: player.y + player.height / 2, radius: 5, vx: player.facing * 8 });
            }
            if (gameState === "PLAYING" && justPressed(jumpButtonIndex)) gamepadInput.up = true;

            previousGamepadButtons = gamepad.buttons.map(button =>
                Boolean(button && (button.pressed || button.value > 0.5))
            );
        }

        function update() {
            pollGamepad();

            if (spawnProtectionTimer > 0) spawnProtectionTimer--;

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            if (gameState === "DYING") {
                deathTimer--;
                if (deathTimer <= 0) {
                    if (lives <= 0) {
                        gameState = "GAMEOVER";
                        if (!scoreSubmitted && score > 0) {
                            scoreSubmitted = true;
                            let playerName = prompt("Game Over ! Entrez votre nom pour le classement mondial :", "Joueur");
                            if (playerName) submitScore(playerName.trim(), score);
                        }
                    } else {
                        player.x = 50; player.y = 300; player.vx = 0; player.vy = 0; player.grounded = false;
                        player.ignorePlatform = null;
                        spawnProtectionTimer = 60;
                        gameState = "PLAYING";
                    }
                }
                return;
            }

            if (gameState === "LEVEL_CLEARING") {
                levelClearTimer--;
                if (levelClearTimer <= 0) {
                    gameState = level >= PRESET_LEVELS.length - 1 ? "VICTORY" : "LEVEL_WAITING";
                }
                return;
            }

            if (gameState === "LEVEL_WAITING") return;
            if (gameState !== "PLAYING") return;

            platforms.forEach(plat => {
                if (plat.type === "moving") {
                    plat.x += plat.vx;
                    if (plat.x <= plat.minX || plat.x >= plat.maxX) plat.vx *= -1;
                }
                if (plat.type === "vanish") {
                    plat.timer++;
                    if (plat.timer % 180 < 120) {
                        plat.visible = true;
                    } else {
                        plat.visible = false;
                    }
                }
            });

            if (keys["ArrowLeft"] || gamepadInput.left) { player.vx = -player.speed; player.facing = -1; }
            else if (keys["ArrowRight"] || gamepadInput.right) { player.vx = player.speed; player.facing = 1; }
            else { player.vx = 0; }

            if ((keys["ArrowUp"] || gamepadInput.up) && player.grounded) {
                player.vy = player.jumpPower; 
                player.grounded = false; 
                player.ignorePlatform = null;
            }

            // Gestion de la flèche du bas pour descendre d'une plateforme
            if ((keys["ArrowDown"] || gamepadInput.down) && player.grounded) {
                platforms.forEach(plat => {
                    if (!plat.isGround && player.x + player.width > plat.x && player.x < plat.x + plat.width &&
                        Math.abs((player.y + player.height) - plat.y) < 5) {
                        player.ignorePlatform = plat; // On ignore temporairement cette plateforme
                        player.grounded = false;
                        player.y += 4; // Petit coup de pouce vers le bas pour amorcer la chute
                    }
                });
            }

            player.vy += gravity;
            player.x += player.vx;
            player.y += player.vy;

            player.grounded = false;
            platforms.forEach(plat => {
                if (!plat.visible) return;
                if (plat === player.ignorePlatform) return; // Ignore la plateforme si le joueur vient de descendre

                // Collision par le haut
                if (player.x + player.width > plat.x && player.x < plat.x + plat.width &&
                    player.y + player.height >= plat.y && player.y + player.height - player.vy <= plat.y + 6 && player.vy >= 0) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                    player.ignorePlatform = null; // Réinitialise l'ignorance une fois posé ailleurs
                    if (plat.type === "moving") {
                        player.x += plat.vx;
                    }
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx;
                if (bullets[i].x < 0 || bullets[i].x > canvas.width) { bullets.splice(i, 1); continue; }
                let bulletHit = false;
                for (let enemy of enemies) {
                    if (enemy.alive && checkCollisionRect({x: bullets[i].x - 5, y: bullets[i].y - 5, width: 10, height: 10}, enemy, 0)) {
                        enemy.alive = false;
                        score += 25;
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, "#FFEB3B", 15);
                        triggerFlash("rgba(255, 255, 0, 0.3)", 10);
                        bulletHit = true; break;
                    }
                }
                if (bulletHit) bullets.splice(i, 1);
            }

            enemies.forEach(enemy => {
                if (enemy.alive) {
                    enemy.x += enemy.vx;
                    if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) enemy.vx *= -1;
                }
            });

            for (let spike of spikes) {
                if (checkCollisionRect(player, spike, 2)) {
                    triggerDeath();
                    return;
                }
            }

            for (let enemy of enemies) {
                if (enemy.alive && checkCollisionRect(player, enemy, 0)) { triggerDeath(); return; }
            }

            let allCollected = true;
            targets.forEach(t => {
                if (!t.collected) {
                    let distX = (player.x + player.width / 2) - t.x;
                    let distY = (player.y + player.height / 2) - t.y;
                    if (Math.abs(distX) < player.width/2 + t.radius && Math.abs(distY) < player.height/2 + t.radius) {
                        t.collected = true;
                        score += 50;
                        createExplosion(t.x, t.y, "#4CAF50", 12);
                        triggerFlash("rgba(0, 255, 0, 0.2)", 10);
                        if (score >= nextLifeMilestone) { lives++; nextLifeMilestone += 250; }
                    }
                }
                if (!t.collected) allCollected = false;
            });

            if (allCollected && targets.length > 0) {
                triggerLevelClear();
            }

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height) triggerDeath();
        }

        function drawButton(x, y, width, label, color = "#37474F") {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, 34);
            ctx.strokeStyle = "#ffffff";
            ctx.strokeRect(x, y, width, 34);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px Arial";
            ctx.textAlign = "center";
            ctx.fillText(label, x + width / 2, y + 22);
        }

        function drawCustomLevels() {
            ctx.fillStyle = "#151515";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#FFEB3B";
            ctx.font = "bold 28px Arial";
            ctx.textAlign = "center";
            ctx.fillText("MES TABLEAUX", canvas.width / 2, 48);

            const visibleLevels = customLevels.slice(customListOffset, customListOffset + 5);
            if (!visibleLevels.length) {
                ctx.fillStyle = "#cccccc";
                ctx.font = "16px Arial";
                ctx.fillText("Aucun tableau sauvegardé pour le moment.", canvas.width / 2, 150);
            }

            visibleLevels.forEach((item, index) => {
                const y = 95 + index * 45;
                ctx.fillStyle = "#263238";
                ctx.fillRect(15, y, 770, 38);
                ctx.textAlign = "left";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px Arial";
                ctx.fillText(item.name, 28, y + 24);
                drawButton(470, y + 2, 105, "Modifier", "#1565C0");
                drawButton(590, y + 2, 90, "Supprimer", "#C62828");
                drawButton(685, y + 2, 90, "Jouer", "#2E7D32");
            });

            if (customLevels.length > 5) {
                ctx.fillStyle = "#aaaaaa";
                ctx.font = "12px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Faites défiler la liste pour voir les autres tableaux.", canvas.width / 2, 326);
            }
            drawButton(15, 350, 250, "Créer un tableau", "#2E7D32");
            drawButton(535, 350, 250, "Retour au menu");
            ctx.textAlign = "left";
        }

        function drawEditor() {
            const levelData = customEditor.level;
            ctx.fillStyle = "#202020";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, canvas.width, 55);
            const tools = [
                ["platform", "Plateforme"],
                ["enemy", "Ennemi"],
                ["target", "Cerise"],
                ["spike", "Pointe"],
                ["erase", "Gomme"]
            ];
            tools.forEach(([tool, label], index) => {
                drawButton(8 + index * 92, 10, 88, label, customEditor.tool === tool ? "#1565C0" : "#37474F");
            });
            drawButton(475, 10, 78, "Sauver", "#2E7D32");
            drawButton(558, 10, 78, "Tester", "#EF6C00");
            drawButton(641, 10, 150, "Liste / retour");

            ctx.fillStyle = "#ffffff";
            ctx.font = "13px Arial";
            ctx.textAlign = "left";
            ctx.fillText(`${levelData.name} — ${customEditor.message}`, 10, 73);

            ctx.strokeStyle = "rgba(255,255,255,0.08)";
            for (let x = 0; x <= canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 80); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 80; y <= canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            levelData.platforms.forEach(platform => {
                ctx.fillStyle = platform.isGround ? "#4CAF50" : "#03A9F4";
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });
            ctx.fillStyle = "#F44336";
            ctx.font = "18px Arial";
            ctx.textAlign = "center";
            levelData.spikes.forEach(spike => ctx.fillText("▲", spike.x + spike.width / 2, spike.y + spike.height));
            ctx.font = "24px Arial";
            levelData.targets.forEach(target => ctx.fillText("🍒", target.x, target.y));
            levelData.enemies.forEach(enemy => ctx.fillText("😈", enemy.x + enemy.width / 2, enemy.y + enemy.height / 2));

            if (customEditor.dragStart) {
                const mouse = customEditor.pointer || customEditor.dragStart;
                ctx.fillStyle = "rgba(3, 169, 244, 0.5)";
                ctx.fillRect(
                    Math.min(customEditor.dragStart.x, mouse.x),
                    customEditor.dragStart.y,
                    Math.max(40, Math.abs(mouse.x - customEditor.dragStart.x)),
                    18
                );
            }

            ctx.fillStyle = "#cccccc";
            ctx.font = "12px Arial";
            ctx.textAlign = "left";
            ctx.fillText("Plateforme : cliquer-glisser. Autres objets : cliquer pour placer. Gomme : cliquer sur un objet.", 10, 394);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            editorNamePanel.hidden = gameState !== "EDITOR";

            if (gameState === "CUSTOM_LEVELS") {
                drawCustomLevels();
                return;
            }

            if (gameState === "EDITOR") {
                drawEditor();
                return;
            }

            if (gameState === "CUSTOM_COMPLETE") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FFEB3B";
                ctx.font = "bold 34px Arial";
                ctx.textAlign = "center";
                ctx.fillText("TABLEAU TERMINÉ !", canvas.width / 2, 155);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Arial";
                ctx.fillText("Score : " + score, canvas.width / 2, 205);
                ctx.fillStyle = "#4CAF50";
                ctx.font = "bold 16px Arial";
                ctx.fillText("Appuyez sur Espace ou Entrée pour continuer", canvas.width / 2, 340);
                ctx.textAlign = "left";
                return;
            }

            if (gameState === "MENU") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#4CAF50";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("😊 JEU DE PLATEFORME 🍒", canvas.width / 2, 50);

                ctx.fillStyle = "#FFEB3B";
                ctx.font = "bold 16px Arial";
                ctx.fillText("--- CLASSEMENT MONDIAL (50 NIVEAUX) ---", canvas.width / 2, 95);

                ctx.font = "15px Arial";
                ctx.fillStyle = "#ffffff";
                if (topScores.length === 0) {
                    ctx.fillText("Chargement du classement...", canvas.width / 2, 135);
                } else {
                    topScores.forEach((item, index) => {
                        ctx.fillText(`${index + 1}. ${item.nom} - ${item.score} pts`, canvas.width / 2, 135 + (index * 24));
                    });
                }

                drawButton(175, 300, 450, "Jouer la campagne — 50 niveaux", "#2E7D32");
                drawButton(175, 350, 450, "Créer / jouer mes tableaux", "#1565C0");
                ctx.textAlign = "left";
                return;
            }

            platforms.forEach(plat => {
                if (!plat.visible) return;
                if (plat.type === "moving") ctx.fillStyle = "#03A9F4";
                else if (plat.type === "vanish") ctx.fillStyle = "#9C27B0";
                else ctx.fillStyle = "#4CAF50";
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            ctx.fillStyle = "#F44336";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            spikes.forEach(s => {
                ctx.fillText("▲", s.x + s.width / 2, s.y + s.height);
            });

            ctx.font = "24px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            targets.forEach(t => { if (!t.collected) ctx.fillText("🍒", t.x, t.y); });
            enemies.forEach(enemy => { if (enemy.alive) ctx.fillText("😈", enemy.x + enemy.width / 2, enemy.y + enemy.height / 2); });

            ctx.fillStyle = "#00BCD4";
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill(); });

            if (gameState !== "DYING") {
                if (spawnProtectionTimer <= 0 || Math.floor(spawnProtectionTimer / 5) % 2 === 0) {
                    ctx.fillText("😊", player.x + player.width / 2, player.y + player.height / 2);
                }
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (flashTimer > 0 && screenFlashColor) {
                ctx.fillStyle = screenFlashColor; ctx.fillRect(0, 0, canvas.width, canvas.height); flashTimer--;
            }

            if (gameState === "LEVEL_WAITING") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FFEB3B"; ctx.font = "bold 28px Arial"; ctx.textAlign = "center";
                ctx.fillText("✨ NIVEAU " + (level + 1) + " TERMINÉ ! ✨", canvas.width / 2, canvas.height / 2 - 30);
                
                ctx.fillStyle = "#4CAF50"; ctx.font = "bold 18px Arial";
                ctx.fillText("Appuyez sur ESPACE pour le Niveau Suivant", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            }

            let remainingTargets = targets.filter(t => !t.collected).length;

            ctx.textAlign = "left"; ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px Arial";
            ctx.fillText("Score: " + score, 15, 25);
            ctx.fillText("Niveau: " + (level + 1), 130, 25);
            ctx.fillText("🍒: " + remainingTargets, 230, 25);
            ctx.fillText("Vies: " + "❤️ ".repeat(Math.max(0, lives)), 330, 25);

            if (gameState === "VICTORY") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#FFEB3B"; ctx.font = "bold 36px Arial"; ctx.textAlign = "center";
                ctx.fillText("🎉 VICTOIRE ! 🎉", canvas.width / 2, 145);

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px Arial";
                ctx.fillText("Vous avez terminé les 50 niveaux !", canvas.width / 2, 195);
                ctx.fillText("Score final : " + score, canvas.width / 2, 235);

                ctx.fillStyle = "#4CAF50"; ctx.font = "bold 16px Arial";
                ctx.fillText("Appuyez sur ESPACE puis entrez votre nom pour le classement", canvas.width / 2, 340);
                ctx.textAlign = "left";
            }

            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#F44336"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, 45);

                ctx.fillStyle = "#FFEB3B"; ctx.font = "bold 16px Arial";
                ctx.fillText("--- TOP 5 MONDIAL ---", canvas.width / 2, 85);

                ctx.font = "15px Arial"; ctx.fillStyle = "#ffffff";
                topScores.forEach((item, index) => {
                    ctx.fillText(`${index + 1}. ${item.nom} - ${item.score} pts`, canvas.width / 2, 115 + (index * 22));
                });

                ctx.fillStyle = "#4CAF50"; ctx.font = "bold 16px Arial";
                ctx.fillText("Appuyez sur ESPACE pour retourner au Menu", canvas.width / 2, 340);
                ctx.textAlign = "left";
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
